# KiroCrew oficial usando el backend Dharma en vez de kiro-cli.
#
#   ../install.sh          genera .env y arranca (recomendado en máquina nueva)
#   docker compose up -d   arranca a mano (si ya tienes .env)
#
# Valores portables: PUERTO y CORS_ORIGINS salen de variables (con default), así
# este archivo NO lleva ninguna IP ni ruta atada a una máquina concreta.

services:
  kirocrew:
    # Por defecto usa la imagen PUBLICADA en GHCR (docker pull, sin compilar).
    # Para construir localmente en su lugar: docker compose build
    image: "${DHARMA_IMAGE:-ghcr.io/chepe263/dharma-kirocrew:latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kirocrew-dharma
    restart: unless-stopped
    ports:
      - "${DHARMA_PORT:-5477}:5476"
    volumes:
      # El repo del faux, montado solo-lectura.
      - ../:/opt/dharma-cli:ro
      # Home persistente de KiroCrew: chats, sesiones, config y estado sobreviven
      # a recreaciones del contenedor.
      - dharma-kirocrew-home:/home/kirocrew
    environment:
      # KiroCrew resolverá este binario en vez de kiro-cli.
      KIROCREW_KIRO_BIN: /opt/dharma-cli/dharma-cli.sh
      KIROCREW_BIND: 0.0.0.0
      KIROCREW_TELEMETRY_DISABLED: 1
      # Orígenes permitidos para el navegador. install.sh lo rellena con la IP
      # del host + localhost. Default seguro para acceso local.
      KIROCREW_CORS_ORIGINS: "${KIROCREW_CORS_ORIGINS:-http://localhost:5477,http://127.0.0.1:5477}"
      # El contenedor es la frontera de aislamiento en este modo.
      KIROCREW_ALLOW_UNSANDBOXED: "1"

  # ── MariaDB OPCIONAL ─────────────────────────────────────────────────────
  # No arranca por defecto. Actívala con:  docker compose --profile db up -d
  # KiroCrew la alcanza en el host 'mariadb' puerto 3306 (misma red del compose).
  # Para una DB en OTRA máquina, no uses esto: apunta tu app a esa IP:puerto.
  mariadb:
    image: mariadb:11
    container_name: dharma-mariadb
    restart: unless-stopped
    profiles: ["db"]
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-changeme}"
      MARIADB_DATABASE: "${DB_NAME:-app}"
      MARIADB_USER: "${DB_USER:-app}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-app}"
    ports:
      # Expuesto solo a localhost del host por seguridad (no a la red).
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - dharma-mariadb-data:/var/lib/mysql

volumes:
  dharma-kirocrew-home:
  dharma-mariadb-data:
