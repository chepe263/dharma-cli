name: publicar-imagen

# Construye docker/Dockerfile (KiroCrew + Node/.NET/PHP) y publica a GHCR bajo
# la cuenta dueña del repo, con el GITHUB_TOKEN automático — sin credenciales
# manuales. La imagen queda en ghcr.io/<owner>/dharma-kirocrew.
on:
  push:
    branches: [master, main]
    paths:
      # Solo reconstruir cuando cambie algo que afecte la imagen.
      - "docker/Dockerfile"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  schedule:
    # Semanal (lunes 10:00 UTC): rehornea sobre el KiroCrew oficial más nuevo.
    - cron: "0 10 * * 1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dharma-kirocrew

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # necesario para publicar en GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR (token automático del repo)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags latest + sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
